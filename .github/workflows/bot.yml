# monthly data bot. pulls the enrichment sources, rebuilds the map json and
# commits the result. a failed collector leaves the repo untouched and the run red
name: data bot

on:
  schedule:
    # the 25th, after zillow's mid-month release and bls's monthly metro data
    - cron: "17 9 25 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "publish even when the data did not change"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # a manual run must never race the scheduled one: both rebase onto main and
  # commit the same generated file
  group: monthly-bot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run the collectors and rebuild the map data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: python -m bot.run_bot

      # main may have moved during the hour the collectors take. rebase the new
      # data onto it so the commit below lands as a fast forward instead of a
      # rejected push that throws the run away.
      #
      # the map json is thrown away first and rebuilt after. it is generated,
      # and it is written as one long line, so any edit upstream conflicts with
      # any edit here. an autostash that conflicts still exits 0, leaves the
      # markers in the file, and the commit step below would add them: that
      # ships invalid json and a map with no data. rebuilding from the merged
      # raw data is the only resolution that means anything for a file nobody
      # writes by hand
      - name: catch up with main
        run: |
          git checkout -- web/public/data/metros.json
          git pull --rebase --autostash origin main
          if [ -n "$(git ls-files --unmerged)" ]; then
            echo "the rebase left conflicts behind, refusing to commit:"
            git ls-files --unmerged
            exit 1
          fi
          python -m bot.build_map_data
          python -c "import json; json.load(open('web/public/data/metros.json'))"

      # after the rebuild, so they see the file that is about to be committed
      - name: run the tests
        run: python run_tests.py

      # commits only if the previous steps passed, with the actions bot identity
      - name: commit the refresh
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: monthly data refresh"
          # .gitignore keeps the fetched-not-redistributed files out of this
          file_pattern: "data/raw web/public/data"

      # same publish as the national strip workflow: the worker serves built
      # assets, so committed numbers are not live until a deploy runs
      - uses: actions/setup-node@v4
        if: (steps.commit.outputs.changes_detected == 'true' || inputs.publish) && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build and publish the map
        if: (steps.commit.outputs.changes_detected == 'true' || inputs.publish) && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: |
          npm ci
          npm run build
          npx wrangler@4.132.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # only needed if the token can see more than one account. wrangler
          # resolves it on its own when the token is scoped to just this one
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: say why nothing was published
        if: (steps.commit.outputs.changes_detected == 'true' || inputs.publish) && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "new data is committed but the map was not published:"
          echo "CLOUDFLARE_API_TOKEN is not set in this repository's secrets."
          echo "create a cloudflare api token with Workers Scripts:Edit and add it."
