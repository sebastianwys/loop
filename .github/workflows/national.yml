# the national strip, on its own schedule. the thirteen indicators come from
# fred, where the rate series publish every business day and the survey series
# monthly, so waiting for the 25th left the top of the dashboard weeks stale.
# this runs the national collector only, rebuilds the map json, and publishes.
name: national strip

on:
  schedule:
    # 21:40 utc on weekdays, after the us close, so the day's rates are in
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # a slow run must never race the next day's
  group: national-strip
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # national is the thirteen strip indicators, fred is the 30 year mortgage
      # rate the strip also shows. fifteen series, both keyed on FRED_API_KEY.
      # zillow is not refreshed for its own sake: its csvs are gitignored, so a
      # checkout cannot see them and the rebuild would blank every zhvi and
      # zori. build_map_data refuses to write that, so the files have to be here
      - name: pull the fred series and rebuild the map data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m bot.run_bot --only national fred zillow

      - name: run the tests
        run: python run_tests.py

      # main may have moved since checkout. rebase so the commit lands as a fast
      # forward instead of a rejected push that throws the run away
      - name: catch up with main
        run: git pull --rebase --autostash origin main

      - name: commit the refresh
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: national strip refresh"
          file_pattern: "data/raw/national data/raw/fred web/public/data"

      # the worker serves the built assets, so new numbers are only live after a
      # deploy. without the token the run still commits and says what is missing
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changes_detected == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build and publish the map
        if: steps.commit.outputs.changes_detected == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        run: |
          npm ci
          npm run build
          npx wrangler@4.132.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: say why nothing was published
        if: steps.commit.outputs.changes_detected == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "new data is committed but the map was not published:"
          echo "CLOUDFLARE_API_TOKEN is not set in this repository's secrets."
          echo "create a cloudflare api token with Workers Scripts:Edit and add it."
